pack: ost
version: 0.1.0
bondstone: ">=0.1"
description: Opportunity Solution Tree for product discovery - outcomes, opportunities, solutions, experiments.

types:
  outcome:
    description: A measurable change in customer behaviour the product is aiming for.
    path: "docs/discovery/outcomes/{id}-{slug}.md"
    id: "OUT-{seq:2}"
    frontmatter:
      required: [title, metric]
      properties:
        title: {type: string, minLength: 5}
        metric: {type: string}
        target: {type: string}
    sections:
      - heading: Why this outcome
        min_words: 15
    extra_sections: allow
    lifecycle:
      field: status
      initial: active
      transitions:
        active: [achieved, abandoned]

  opportunity:
    description: A customer need, pain point or desire found in research.
    path: "docs/discovery/opportunities/{id}-{slug}.md"
    id: "OPP-{seq:3}"
    frontmatter:
      required: [title]
      properties:
        title: {type: string, minLength: 5}
    sections:
      - heading: Evidence
        min_words: 15
    extra_sections: allow
    lifecycle:
      field: status
      initial: identified
      transitions:
        identified: [targeted, parked]
        targeted: [addressed, parked]
        parked: [identified]

  solution:
    description: An idea that could address an opportunity.
    path: "docs/discovery/solutions/{id}-{slug}.md"
    id: "SOL-{seq:3}"
    frontmatter:
      required: [title]
      properties:
        title: {type: string, minLength: 5}
    sections:
      - heading: Idea
        min_words: 10
      - heading: Assumptions
    extra_sections: allow
    lifecycle:
      field: status
      initial: candidate
      transitions:
        candidate: [selected, dropped]
        selected: [delivered, dropped]

  experiment:
    description: A test of one or more assumptions behind a solution.
    path: "docs/discovery/experiments/{id}-{slug}.md"
    id: "EXP-{seq:3}"
    frontmatter:
      required: [title]
      properties:
        title: {type: string, minLength: 5}
        result: {enum: [validated, invalidated, inconclusive]}
    sections:
      - heading: Assumption under test
      - heading: Method
      - heading: Findings
        optional: true
    extra_sections: allow
    lifecycle:
      field: status
      initial: planned
      transitions:
        planned: [running, cancelled]
        running: [concluded, cancelled]
      frozen: [concluded]

links:
  serves:
    description: The outcome this opportunity would move.
    from: opportunity
    to: outcome
    inverse: served_by
  child_of:
    description: The broader opportunity this one is part of.
    from: opportunity
    to: opportunity
    max: 1
    inverse: parent_of
    acyclic: true
  addresses:
    description: The opportunities this solution is meant to address.
    from: solution
    to: opportunity
    min: 1
    inverse: addressed_by
  tests:
    description: The solutions whose assumptions this experiment tests.
    from: experiment
    to: solution
    min: 1
    inverse: tested_by

rules:
  - id: opportunity-is-rooted
    description: Every opportunity hangs off an outcome or a parent opportunity.
    severity: error
    select: {type: opportunity}
    require:
      any:
        - outgoing: {link: serves, min: 1}
        - outgoing: {link: child_of, min: 1}
    fix: "Add `serves: [OUT-NN]` or `child_of: [OPP-NNN]` to the frontmatter."

  - id: targeted-opportunity-compares-solutions
    description: A targeted opportunity has at least two solutions to compare.
    severity: warn
    select: {type: opportunity, where: {status: targeted}}
    require:
      incoming: {link: addresses, min: 2}
    fix: "bondstone new ost/solution --title '...' --link addresses={id}"

  - id: selected-solution-is-tested
    description: A selected or delivered solution has at least one concluded experiment.
    severity: warn
    select: {type: solution, where: {status: [selected, delivered]}}
    require:
      incoming: {link: tests, min: 1, where: {status: concluded}}
    fix: "bondstone new ost/experiment --title '...' --link tests={id}"

  - id: concluded-experiment-has-result
    description: A concluded experiment records its result.
    severity: error
    select: {type: experiment, where: {status: concluded}}
    require:
      all:
        - fields: {required: [result]}
        - sections:
            - heading: Findings
              min_words: 15
    fix: "Set `result:` in the frontmatter and write the Findings section."

views:
  - id: opportunity-solution-tree
    title: Opportunity solution tree
    output: docs/discovery/README.md
    layout: tree
    select: {type: outcome}
    follow: [served_by, parent_of, addressed_by, tested_by]

profiles:
  solo:
    targeted-opportunity-compares-solutions: ignore
    selected-solution-is-tested: advisory
  team: {}
