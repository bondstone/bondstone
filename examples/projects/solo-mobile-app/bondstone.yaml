# A one-person mobile app: decisions, capability specs and one architecture page.
bondstone: 1
profile: solo
packs:
  - source: ../../packs/adr
  - source: ../../packs/solo-app
docs: ["docs/**/*.md"]
code: ["lib/**", "test/**"]

rules:
  - id: migration-needs-decision
    description: A database migration comes with a decision record.
    severity: error
    on_change:
      paths: ["lib/data/migrations/**"]
      change: [added]
    require:
      touched: {type: adr/decision, min: 1}
    unless:
      trailer: "Decision: none"
    fix: "bondstone new adr/decision --title '<what changes in the data model and why>'"
