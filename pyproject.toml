[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bondstone"
version = "0.1.0"
description = "Enforce living documentation with composable rule packs and bridges."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4",
    "packaging>=23",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bondstone = "bondstone.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bondstone"]
# bondstone: REQ-LIB-007
# fixtures are test data for `bondstone pack test` in this repository; the sdist keeps them
exclude = ["src/bondstone/library/**/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
