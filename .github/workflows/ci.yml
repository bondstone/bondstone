name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # check --base and the baseline read older commits
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q
      - name: fixtures of the library's and the example's packs
        run: >-
          uv run bondstone pack test
          library/src/bondstone_library/packs/*
          examples/habit-tracker/.bondstone/packs/*
      - name: both packages build
        run: uv build --all-packages --out-dir "$RUNNER_TEMP/dist"
      - name: bondstone check on the example
        run: uv run bondstone --root examples/habit-tracker check
      - name: bondstone check on bondstone's own documentation
        run: uv run bondstone check --fail-on warn
      - name: bondstone check against the pull request's base
        if: github.event_name == 'pull_request'
        run: uv run bondstone check --fail-on warn --base origin/${{ github.base_ref }}
      - name: generated views and agent instructions are up to date
        run: |
          uv run bondstone --root examples/habit-tracker gen
          uv run bondstone --root examples/habit-tracker agent
          uv run bondstone gen
          uv run bondstone agent
          git diff --exit-code
