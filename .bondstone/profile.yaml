# Bondstone documents itself: decisions, living capability specs traced to the code, and
# Spec Kit features for its own changes. Packs, bridges and the rules that tie a change to its
# feature and its capability come from the `starter-speckit` preset of the bondstone-library
# package in `library/` (ADR-004, ADR-012, ADR-017).
bondstone: 1
baseline: 'e994d119c55806e90b695d431405cf4db69813bc'
extends: [starter-speckit@1]
packs: [cli@1, release@1]
bridges: [cli-capability@1, release-speckit@1]
# `specs/` is not listed: only a feature's spec.md is a document, and its type finds it.
docs: ["docs/adr/**/*.md", "docs/capabilities/**/*.md", "docs/cli/**/*.md", "docs/releases/**/*.md"]
defaults:
  owner: Adam Dworzyński
code:
  include: ["src/bondstone/**/*.py", "library/src/**/*.yaml", "library/src/**/*.yml", "library/tests/*.py"]
  exclude: ["library/src/**/fixtures/**"]
overrides:
  starter-speckit/source-change-has-feature: error   # stricter than the preset

views:
  - id: decisions-applied
    title: Capabilities and the decisions that constrain them
    output: docs/generated/decisions-applied.md
    render: matrix
    rows: {type: "capability:Capability"}
    cols: {type: "adr:Decision"}
    via: [constrained_by]
  - id: decision-usage
    title: Decisions and where they apply
    output: docs/generated/decision-usage.md
    select: {type: "adr:Decision"}
    columns: [id, title, status, "<-constrained_by"]

waivers:
  # Accepted decisions that no capability applies yet, because the phase that builds them has not started.
  - {rule: adr-capability/accepted-decision-is-applied, node: ADR-014, reason: "Portfolio links come after v1.", expires: 2027-06-30}
