# bondstone documents itself. See docs/self-hosting.md.
bondstone: 0.1
packs: [adr@1, capability@1, change@0.1, release@0.1, cli@0.1]
bridges: [adr-capability@1, change-capability@0.2, change-adr@0.1, release-change@0.1, cli-capability@0.1]
sources: [.bondstone/packs]
scan: ["docs/**/*.md"]
defaults:
  owner: dworek
code:
  include: ["src/bondstone/**/*.py"]

rules:
  - id: source-change-updates-traced-spec
    description: Changes to bondstone's source update the capability specs the changed code implements.
    on_change: {paths: ["src/bondstone/**/*.py"]}
    require:
      - changed: {role: living-spec}
        traced: true
        min: 1

  - id: source-change-has-proposal
    description: Changes to bondstone's source or library come with a change proposal.
    severity: warn
    on_change: {paths: ["src/bondstone/**/*.py", "src/bondstone/library/**"]}
    require:
      - changed: {role: change}
        min: 1

waivers:
  # CHG-003 moved code-tag scanning from checks.py into graph.py so selectors can use it.
  # Behaviour is unchanged (covered by the existing tests); remove after the push that lands it.
  - rule: profile/source-change-updates-traced-spec
    node: CAP-code-traceability
    reason: Refactor in CHG-003 - tag scanning moved into the graph, no behaviour change.
    expires: 2026-11-17
  - rule: profile/source-change-updates-traced-spec
    node: CAP-graph
    reason: Refactor in CHG-003 - build_graph now records code tags; behaviour specified in REQ-RUL-007.
    expires: 2026-11-17
  - rule: profile/source-change-updates-traced-spec
    node: CAP-views
    reason: Same build_graph region as CAP-graph (shared tag block); views are unaffected.
    expires: 2026-11-17
