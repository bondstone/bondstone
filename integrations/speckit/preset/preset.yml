schema_version: "1.0"

preset:
  id: "bondstone"
  name: "Bondstone simple-app"
  version: "0.0.1"
  description: "One story per spec, scoped example IDs in test names, expected and actual living-doc changes"
  author: "Bondstone"
  repository: "https://github.com/bondstone/bondstone"
  license: "MIT"

requires:
  speckit_version: ">=1.2.0"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Story front-matter before Spec Kit's spec, Living doc changes after it"
      strategy: "wrap"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Adds the Expected living-doc impact section"
      strategy: "append"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Adds the example-test and living-doc tasks"
      strategy: "append"
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "One story per spec, linked by front-matter, examples by ID"
      strategy: "append"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Declare the expected living-doc impact"
      strategy: "append"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Always include example-named tests and the living-doc update"
      strategy: "append"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Run Bondstone's deterministic checks; errors block implement"
      strategy: "append"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Test-first, living docs in the same commit"
      strategy: "append"

tags:
  - "living-docs"
  - "traceability"
  - "testing"
